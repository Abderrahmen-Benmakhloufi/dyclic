name: lecture_aide
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.17+19

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  intl: any
  google_fonts: ^6.2.1
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/fonts/
    - assets/audio/
    - assets/data/
    - assets/images/characters/

  fonts:
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic

    - family: Lexend
      fonts:
        - asset: assets/fonts/static/Lexend-Regular.ttf
        - asset: assets/fonts/static/Lexend-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/static/Lexend-Medium.ttf
          weight: 500

    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700

    - family: Arial
      fonts:
        - asset: assets/fonts/Arial-Regular.ttf
        - asset: assets/fonts/Arial-Bold.ttf
          weight: 700
